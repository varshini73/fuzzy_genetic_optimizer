<!-- ChatGPT Widget Component -->
<div class="chatbot-widget">
    <button class="chatbot-toggle" id="chatbotToggle">
        <i class="fas fa-robot"></i>
        <span>AI Pricing Assistant</span>
        <span class="badge bg-warning ms-2">GPT</span>
    </button>
    
    <div class="chatbot-container" id="chatbotContainer" style="display: none;">
        <div class="chatbot-header">
            <div>
                <i class="fas fa-robot me-2"></i>
                <strong>AI Pricing Assistant</strong>
                <span class="badge bg-success ms-2">ChatGPT</span>
            </div>
            <div>
                <button class="btn btn-sm btn-outline-light me-2" id="clearChatBtn" title="Clear conversation">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="btn-close btn-close-white" id="closeChatbot"></button>
            </div>
        </div>
        
        <div class="chatbot-messages" id="chatMessages">
            <div class="message bot">
                <i class="fas fa-robot me-2"></i>
                <div>
                    Hello! I'm your AI Pricing Assistant powered by ChatGPT. 
                    I can explain pricing recommendations, discuss confidence scores, 
                    and provide strategic advice. What would you like to know?
                </div>
            </div>
        </div>
        
        <div class="chatbot-suggestions" id="chatSuggestions">
            <button class="suggestion-btn">What does confidence score mean?</button>
            <button class="suggestion-btn">How does fuzzy logic work?</button>
            <button class="suggestion-btn">How can I maximize profit?</button>
            <button class="suggestion-btn">What factors affect pricing?</button>
        </div>
        
        <div class="chatbot-input">
            <input type="text" id="chatInput" placeholder="Ask me anything about pricing..." autocomplete="off">
            <button id="sendMessage" title="Send message">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        
        <div class="chatbot-footer">
            <small class="text-muted">
                <i class="fas fa-shield-alt me-1"></i>
                Your data is not stored or used for training
            </small>
        </div>
    </div>
</div>

<style>
.chatbot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.chatbot-toggle {
    background: linear-gradient(135deg, #10a37f 0%, #1a7f64 100%);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 500;
    box-shadow: 0 4px 15px rgba(16, 163, 127, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.chatbot-toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(16, 163, 127, 0.5);
}

.chatbot-container {
    position: absolute;
    bottom: 70px;
    right: 0;
    width: 380px;
    height: 550px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #e0e0e0;
}

.chatbot-header {
    background: linear-gradient(135deg, #10a37f 0%, #1a7f64 100%);
    color: white;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chatbot-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f7f7f8;
}

.message {
    padding: 10px 14px;
    border-radius: 18px;
    max-width: 85%;
    animation: fadeIn 0.3s ease;
    font-size: 14px;
    line-height: 1.5;
}

.message.user {
    background: linear-gradient(135deg, #10a37f 0%, #1a7f64 100%);
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}

.message.bot {
    background: white;
    color: #333;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    display: flex;
    gap: 10px;
}

.message.bot i {
    color: #10a37f;
    font-size: 18px;
}

.chatbot-suggestions {
    padding: 12px 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    border-top: 1px solid #e0e0e0;
    background: white;
}

.suggestion-btn {
    background: #f0f0f0;
    border: 1px solid #d0d0d0;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #333;
}

.suggestion-btn:hover {
    background: #10a37f;
    color: white;
    border-color: #10a37f;
}

.chatbot-input {
    padding: 15px;
    border-top: 1px solid #e0e0e0;
    display: flex;
    gap: 10px;
    background: white;
}

.chatbot-input input {
    flex: 1;
    border: 1px solid #d0d0d0;
    border-radius: 25px;
    padding: 10px 16px;
    outline: none;
    font-size: 14px;
}

.chatbot-input input:focus {
    border-color: #10a37f;
}

.chatbot-input button {
    background: #10a37f;
    color: white;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chatbot-input button:hover {
    background: #1a7f64;
    transform: scale(1.05);
}

.chatbot-footer {
    padding: 8px 15px;
    text-align: center;
    background: #f7f7f8;
    border-top: 1px solid #e0e0e0;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.chatbot-messages::-webkit-scrollbar {
    width: 6px;
}

.chatbot-messages::-webkit-scrollbar-track {
    background: #f1f1f1;
}

.chatbot-messages::-webkit-scrollbar-thumb {
    background: #c1c1c1;
    border-radius: 3px;
}
</style>

<script>
let isWaitingForResponse = false;

document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('chatbotToggle');
    const container = document.getElementById('chatbotContainer');
    const close = document.getElementById('closeChatbot');
    const sendBtn = document.getElementById('sendMessage');
    const input = document.getElementById('chatInput');
    const clearBtn = document.getElementById('clearChatBtn');
    
    toggle?.addEventListener('click', () => {
        container.style.display = 'flex';
        toggle.style.display = 'none';
    });
    
    close?.addEventListener('click', () => {
        container.style.display = 'none';
        toggle.style.display = 'flex';
    });
    
    sendBtn?.addEventListener('click', sendMessage);
    input?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !isWaitingForResponse) sendMessage();
    });
    
    clearBtn?.addEventListener('click', async () => {
        try {
            await fetch('/api/chat/clear', { method: 'POST' });
            document.getElementById('chatMessages').innerHTML = `
                <div class="message bot">
                    <i class="fas fa-robot"></i>
                    <div>Conversation cleared. How can I help you?</div>
                </div>
            `;
        } catch (error) {
            console.error('Error clearing chat:', error);
        }
    });
    
    document.querySelectorAll('.suggestion-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.getElementById('chatInput').value = this.textContent;
            sendMessage();
        });
    });
});

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    
    if (!message || isWaitingForResponse) return;
    
    isWaitingForResponse = true;
    addMessage(message, 'user');
    input.value = '';
    addTypingIndicator();
    
    try {
        const taskId = localStorage.getItem('lastTaskId');
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, task_id: taskId })
        });
        
        const data = await response.json();
        removeTypingIndicator();
        addMessage(data.response, 'bot');
        
        if (data.suggestions) {
            updateSuggestions(data.suggestions);
        }
    } catch (error) {
        removeTypingIndicator();
        addMessage("Sorry, I'm having trouble connecting. Please try again.", 'bot');
    } finally {
        isWaitingForResponse = false;
    }
}

function addMessage(text, sender) {
    const messagesDiv = document.getElementById('chatMessages');
    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${sender}`;
    
    if (sender === 'bot') {
        messageDiv.innerHTML = `<i class="fas fa-robot"></i><div>${escapeHtml(text)}</div>`;
    } else {
        messageDiv.textContent = text;
    }
    
    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function addTypingIndicator() {
    const messagesDiv = document.getElementById('chatMessages');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'message bot typing';
    typingDiv.id = 'typingIndicator';
    typingDiv.innerHTML = `<i class="fas fa-robot"></i><div>Thinking...</div>`;
    messagesDiv.appendChild(typingDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function removeTypingIndicator() {
    document.getElementById('typingIndicator')?.remove();
}

function updateSuggestions(suggestions) {
    const suggestionsDiv = document.getElementById('chatSuggestions');
    suggestionsDiv.innerHTML = suggestions.map(s => 
        `<button class="suggestion-btn">${s}</button>`
    ).join('');
    
    document.querySelectorAll('.suggestion-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.getElementById('chatInput').value = this.textContent;
            sendMessage();
        });
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
